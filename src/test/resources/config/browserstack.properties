# Ejecución en BrowserStack App Automate.
# Credenciales NO van aquí: usa env BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY
# o -Dbrowserstack.user=... -Dbrowserstack.key=...
hub.url=https://hub.browserstack.com/wd/hub
platformName=Android
automationName=UiAutomator2
# Sobrescribible con -DdeviceName="Samsung Galaxy S23" -DosVersion="13.0" -Dapp=bs://...
deviceName=Samsung Galaxy S23
osVersion=13.0
# OBLIGATORIO: hash devuelto al subir el APK (ver run-browserstack.sh)
app=bs://PON_AQUI_EL_HASH
noReset=false
autoGrantPermissions=true
newCommandTimeout=300
implicitWait=15
bs.projectName=GradleAppium
bs.buildName=calc-build-local
bs.sessionName=Calculator sum test
bs.appiumVersion=2.19.0

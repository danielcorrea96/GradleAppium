# Ejecución local: emulator + Appium en localhost
hub.url=http://localhost:4723
platformName=Android
automationName=UiAutomator2
deviceName=Medium_Phone_API_36.0
osVersion=
# vacío = usa appPackage/appActivity (calculadora del emulador).
# Para instalar un APK local pon ruta: app=calculator-monolithic.apk
app=
appPackage=com.google.android.calculator
appActivity=com.android.calculator2.Calculator
noReset=false
autoGrantPermissions=true
newCommandTimeout=300
implicitWait=15

name: Android Appium Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  appium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & UiAutomator2 driver
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Pixel 6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "Emulator started. Installing calculator APKs..."
            adb install-multiple calculator-base.apk calculator-split.apk
            adb shell am start -n com.google.android.calculator/com.android.calculator2.Calculator
            sleep 3

            echo "Starting Appium server in background..."
            appium &
            APPIUM_PID=$!
            echo "Appium PID: $APPIUM_PID"

            echo "Waiting for Appium to be ready..."
            for i in $(seq 1 30); do
              if curl -s http://localhost:4723/status > /dev/null 2>&1; then
                echo "Appium is ready!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            echo "Running Gradle tests..."
            ./gradlew clean test --rerun-tasks

            echo "Stopping Appium server..."
            kill $APPIUM_PID 2>/dev/null || true

      - name: Upload Serenity Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-reports
          path: target/serenity-reports/
          retention-days: 14

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/
          retention-days: 14

plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '5.3.9'
}

group = 'com.appium'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('net.serenity-bdd:serenity-bom:5.3.9')
    implementation 'net.serenity-bdd:serenity-core'
    implementation 'net.serenity-bdd:serenity-screenplay'
    implementation 'net.serenity-bdd:serenity-screenplay-webdriver'
    implementation 'net.serenity-bdd:serenity-junit5'
    testImplementation 'io.appium:java-client:10.1.1'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.slf4j:slf4j-simple:2.0.17'
}

test {
    useJUnitPlatform()
    systemProperty 'serenity.project.name', 'GradleAppium'
    // Propaga el target y las caps a los tests (permite -Dexecution=...):
    // ./gradlew test -Dexecution=local
    // ./gradlew test -Dexecution=browserstack -DdeviceName="Samsung Galaxy S23" -DosVersion="13.0" -Dapp=bs://...
    for (key in ['execution', 'hub.url', 'platformName', 'automationName', 'deviceName',
                 'osVersion', 'app', 'appPackage', 'appActivity', 'noReset',
                 'autoGrantPermissions', 'newCommandTimeout', 'implicitWait',
                 'browserstack.user', 'browserstack.key',
                 'bs.projectName', 'bs.buildName', 'bs.sessionName', 'bs.appiumVersion']) {
        String val = System.getProperty(key)
        if (val != null) {
            systemProperty key, val
        }
    }
}

serenity {
    testRoot = 'src/test/java'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
